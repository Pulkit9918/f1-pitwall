version: 2

models:
  - name: silver_track_status
    description: "Silver: track status changes (clear, yellow, safety car, red, VSC) per session, deduplicated on session, time and status."
    columns:
      - name: status
        description: Track status code.
        data_tests:
          - accepted_values:
              arguments:
                values: ['1', '2', '4', '5', '6', '7']
              config:
                severity: warn
      - {name: session_key, description: "Session identifier of the form YYYY-Rnn-CODE, e.g. 2025-R07-R. Round is FastF1's round number, CODE is the session code."}
      - {name: year, description: "Season (calendar year)."}
      - {name: round, description: "Round number of the weekend as numbered by FastF1 (this can differ from the official calendar)."}
      - {name: session_code, description: "Session code: FP1, FP2, FP3 (practice), Q (qualifying), R (race), S (sprint), SQ (sprint qualifying) or SS (sprint shootout)."}
      - {name: message, description: "Status label as delivered by the feed, e.g. AllClear, Yellow, SCDeployed, Red, VSCDeployed or VSCEnding."}
      - {name: time_s, description: "Session time in seconds at which the status began."}
