version: 2

sources:
  - name: lake
    description: >
      Bronze layer: the Parquet lake written by ingest.py, read in place (nothing is copied).
      Hive partitions year=/round=/session= become the columns year, round and session.
    meta:
      owner: data-eng
      layer: bronze
    tables:
      - name: laps
        description: One row per driver lap, as delivered by FastF1.
        meta:
          external_location: "read_parquet('{{ env_var('F1_LAKE', 'data/lake') }}/laps/*/*/*/part.parquet', hive_partitioning = true, union_by_name = true)"
        columns:
          - name: Driver
            data_tests:
              - not_null:
                  config:
                    severity: warn
          - name: LapNumber
            description: Null on a few raw rows; silver drops them.
            data_tests:
              - not_null:
                  config:
                    severity: warn

      - name: results
        description: One row per driver per session (classification, grid, status, points, qualifying times).
        meta:
          external_location: "read_parquet('{{ env_var('F1_LAKE', 'data/lake') }}/results/*/*/*/part.parquet', hive_partitioning = true, union_by_name = true)"
        columns:
          - name: Abbreviation
            data_tests:
              - not_null:
                  config:
                    severity: warn

      - name: race_control
        description: Race control messages (flags, safety car, penalties, lap deletions).
        meta:
          external_location: "read_parquet('{{ env_var('F1_LAKE', 'data/lake') }}/race_control/*/*/*/part.parquet', hive_partitioning = true, union_by_name = true)"

      - name: weather
        description: Weather samples during a session.
        meta:
          external_location: "read_parquet('{{ env_var('F1_LAKE', 'data/lake') }}/weather/*/*/*/part.parquet', hive_partitioning = true, union_by_name = true)"

      - name: track_status
        description: Track status changes, one file per session.
        meta:
          external_location: "read_parquet('{{ env_var('F1_LAKE', 'data/lake') }}/track_status/*/*/*/part.parquet', hive_partitioning = true, union_by_name = true)"

      - name: telemetry_car
        description: >
          Car telemetry per driver (speed, rpm, gear, throttle, DRS, brake), about 3.8 samples per second,
          one file per session. 2022 onward, and only for non-practice sessions.
        meta:
          external_location: "read_parquet('{{ env_var('F1_LAKE', 'data/lake') }}/telemetry_car/*/*/*/part.parquet', hive_partitioning = true, union_by_name = true)"

      - name: telemetry_pos
        description: >
          Car position (x, y, z) and an on-track or off-track status per driver, about 3.8 samples per second,
          one file per session. Same sessions as telemetry_car.
        meta:
          external_location: "read_parquet('{{ env_var('F1_LAKE', 'data/lake') }}/telemetry_pos/*/*/*/part.parquet', hive_partitioning = true, union_by_name = true)"


  - name: history
    description: Jolpica (Ergast-compatible) history tables, 1950 to now, one Parquet file each.
    meta:
      owner: data-eng
      layer: bronze
    tables:
      - name: results
        meta:
          external_location: "read_parquet('{{ env_var('F1_LAKE', 'data/lake') }}/history/results.parquet')"
      - name: driver_standings
        meta:
          external_location: "read_parquet('{{ env_var('F1_LAKE', 'data/lake') }}/history/driver_standings.parquet')"
      - name: constructor_standings
        meta:
          external_location: "read_parquet('{{ env_var('F1_LAKE', 'data/lake') }}/history/constructor_standings.parquet')"
      - name: circuits
        meta:
          external_location: "read_parquet('{{ env_var('F1_LAKE', 'data/lake') }}/history/circuits.parquet')"
      - name: constructors
        meta:
          external_location: "read_parquet('{{ env_var('F1_LAKE', 'data/lake') }}/history/constructors.parquet')"
      - name: drivers
        meta:
          external_location: "read_parquet('{{ env_var('F1_LAKE', 'data/lake') }}/history/drivers.parquet')"

  - name: manifest
    description: >
      The ingest log: one JSON line per run, written by ingest.py (sessions.jsonl) and by
      scripts/backfill_track_status.py (backfill.jsonl). Only the fields listed below are read.
    meta:
      owner: data-eng
      layer: bronze
    tables:
      - name: runs
        description: One row per ingest or backfill attempt, with the rows written per table in the tables field.
        meta:
          external_location: >-
            read_json('{{ env_var('F1_LAKE', 'data/lake') }}/_manifest/*.jsonl', format = 'newline_delimited',
            filename = true, columns = {{ '{{' }}year: 'BIGINT', round: 'BIGINT', requested_event: 'VARCHAR',
            session: 'VARCHAR', status: 'VARCHAR', error: 'VARCHAR', ingested_at: 'VARCHAR', "at": 'VARCHAR',
            with_telemetry: 'BOOLEAN', seconds: 'DOUBLE', tables: 'JSON'}})
