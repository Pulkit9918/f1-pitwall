name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints/app.txt
      - name: Install
        run: pip install -r requirements-app.txt -r requirements-dev.txt -c constraints/app.txt
      - name: Install API test dependencies
        run: pip install -r requirements-api.txt httpx
      - name: Static check (syntax errors and undefined names only)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Tests
        run: pytest -q
